name: MelodyCamera
options:
  bundleIdPrefix: com.melody
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
packages:
  DrawThings:
    url: https://github.com/drawthingsai/draw-things-community
    revision: b5e9fb925ca5394b747e0e98a8c293bbab5091ca
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    exactVersion: 0.16.0
  MelodyModules:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: ""
targets:
  MelodyCamera:
    type: application
    platform: iOS
    sources:
      - Sources/MelodyApp
    dependencies:
      - package: DrawThings
        product: _MediaGenerationKit
      - package: LiteRTLM
        product: LiteRTLM
      - package: MelodyModules
        product: MelodyCore
      - package: MelodyModules
        product: MelodyImaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melody.camera
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 35PMA35HQU
    info:
      path: ios/Info.plist
      properties:
        CFBundleDisplayName: Melody 相机
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: 用于取景拍照和按需采集构图分析画面。
        NSPhotoLibraryAddUsageDescription: 仅在你点击保存时，将原片或调色副本写入相册。
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
schemes:
  MelodyCamera:
    build:
      targets:
        MelodyCamera: all
    run:
      config: Debug
