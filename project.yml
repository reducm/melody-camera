name: MelodyCamera
options:
  bundleIdPrefix: com.melody
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
packages:
  MelodyModules:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: ""
targets:
  MelodyCamera:
    type: application
    platform: iOS
    sources:
      - Sources/MelodyApp
    dependencies:
      - package: MelodyModules
        product: MelodyCore
      - package: MelodyModules
        product: MelodyImaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melody.camera
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: ios/Info.plist
      properties:
        CFBundleDisplayName: Melody 相机
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: 用于取景拍照和按需采集构图分析画面。
        NSPhotoLibraryAddUsageDescription: 仅在你点击保存时，将原片或调色副本写入相册。
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
schemes:
  MelodyCamera:
    build:
      targets:
        MelodyCamera: all
    run:
      config: Debug
